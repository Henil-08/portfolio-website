services:
  web:
    image: ghcr.io/henil-08/portfolio-website:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # Licensed assets that aren't in the public repo. Copy them to ~/portfolio/assets.
      - ./assets/racero.otf:/app/public/fonts/racero.otf:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
